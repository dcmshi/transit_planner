[project]
name = "transit-planner"
version = "0.1.0"
description = "Reliability-first routing for GO Transit buses (Toronto ↔ Guelph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "gtfs-realtime-bindings>=1.0.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "protobuf>=4.25.0",
    "apscheduler>=3.10.4",
    "aiofiles>=23.2.0",
    "psycopg[binary]>=3.3.2",
    "geoalchemy2>=0.18.1",
    "shapely>=2.1.2",
    "tzdata>=2025.3",
    "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.0.0",
    "ruff>=0.15.21",
    "types-networkx>=3.6.1.20260728",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 (pycodestyle errors), F (pyflakes), I (import sorting).
# E501 (line length) intentionally not selected — docstrings and SQL
# literals run long; readability wins.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["."]
# Alembic revision scripts are generated, and GeoAlchemy2 attaches its
# create_geospatial_* operations to `op` at runtime where mypy cannot see
# them.  Hand-written alembic/env.py is still checked.
exclude = ["^\\.venv/", "^alembic/versions/"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

# No stubs published and no py.typed marker: gtfs-realtime-bindings ships
# generated protobuf modules, apscheduler 3.x predates inline typing.
[[tool.mypy.overrides]]
module = ["google.transit.*", "apscheduler.*"]
ignore_missing_imports = true

# Test bodies are still checked; only the "-> None" on every test function
# is waived — 400+ signatures of pure ceremony that catch nothing.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.ruff.lint.isort]
known-first-party = [
    "api", "db", "graph", "ingestion", "llm", "reliability", "routing",
    "config", "gtfs_time",
]
